<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamFlow</title>
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080c14" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Rejim birinchi boʻyalishdan oldin qoʻyiladi: React yuklanguncha
         kutsak, kunduzgi rejimdagi odam bir lahza qora ekranni koʻrib qoladi.
         Kalit `src/theme.ts` dagi THEME_KEY bilan bir xil. -->
    <script>
      (function () {
        var t;
        try { t = localStorage.getItem("teamflow.theme"); } catch (e) { t = null; }
        if (t !== "light" && t !== "dark") {
          t = "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9889;</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
